function useScale() {
  const [sc, setSc] = useState(1);
  useEffect(() => {
    const upd = () => setSc(Math.min(1, (window.innerWidth - 32) / W));
    upd();
    window.addEventListener("resize", upd);
    return () => window.removeEventListener("resize", upd);
  }, []);
  return sc;
}

/* ══ PAGE SHELL ══ */
function Page({ bg, children, id }) {
  return (
    <div id={id} style={{ width:W, height:H, background:bg, position:"relative", overflow:"hidden", flexShrink:0, boxShadow:"0 8px 36px rgba(0,0,0,0.6)" }}>
      {children}

        backgroundImage:`url("data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/200/svg' width='200' height='200'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E")` }}/>
    </div>
  );
}

/* Ruled background lines ONLY when lined={true} (Notes page), preventing collisions with structured rows */

        {children}
      </div>
      <div style={{ position:"absolute", bottom:10, [side==="L"?"left":"right"]:PAD,
        ...elite("0.5rem","rgba(60,42,10,0.28)"), letterSpacing:"0.2em" }}>{num}</div>

/* ══ STAMPS — cream-matched perforations & html2canvas-safe offset shadow ══ */
function Stamp({ color, pageBg=CREAM, w, h, rot=0, lines, onToggle, title }) {
  const r=4.5, gap=14, pad=Math.round(r)+4;
  const bw=w-pad*2, bh=h-pad*2;

  const holes = [];
  for(let x=pad; x<=w-pad; x+=gap){
    holes.push(<circle key={"t"+x} cx={x} cy={pad-1}   r={r} fill={pageBg}/>);
    holes.push(<circle key={"b"+x} cx={x} cy={h-pad+1} r={r} fill={pageBg}/>);
  }
  for(let y=pad+gap; y<=h-pad-gap; y+=gap){
    holes.push(<circle key={"l"+y} cx={pad-1} cy={y}   r={r} fill={pageBg}/>);
    holes.push(<circle key={"R"+y} cx={w-pad+1} cy={y} r={r} fill={pageBg}/>);
  }

  const cx = w/2;
  let y = pad + 14;
  const els = [];

  const push = (el, dy) => { els.push(el); y += dy; };

  for(const ln of lines){
    switch(ln.type){
      case "month":
        push(<text key={y} x={cx} y={y} textAnchor="middle" fontSize={7} fill="rgba(255,245,210,0.44)" fontFamily={ELITE} letterSpacing={2}>{ln.text}</text>, 13);
        break;
      case "flag":
        push(<text key={y} x={cx} y={y} textAnchor="middle" fontSize={15}>{ln.text}</text>, 18);
        break;
      case "code":
        push(<text key={y} x={cx} y={y} textAnchor="middle" fontSize={18} fill="rgba(255,245,210,0.94)" fontFamily={ELITE} letterSpacing={3}>{ln.text}</text>, 22);
        break;
      case "rule":
        push(<line key={y} x1={cx-bw*0.3} y1={y-4} x2={cx+bw*0.3} y2={y-4} stroke="rgba(255,245,210,0.25)" strokeWidth={1}/>, 6);
        break;
      case "icon":
        push(<text key={y} x={cx} y={y} textAnchor="middle" fontSize={14}>{ln.text}</text>, 17);
        break;
      case "title":
        push(<text key={y} x={cx} y={y} textAnchor="middle" fontSize={8.5} fill="rgba(255,245,210,0.93)" fontFamily={FELL} fontStyle="italic">{ln.text}</text>, 12);
        break;
      case "title2":
        push(<text key={y} x={cx} y={y} textAnchor="middle" fontSize={8.5} fill="rgba(255,245,210,0.93)" fontFamily={FELL} fontStyle="italic">{ln.text}</text>, 13);
        break;
      case "author":
        push(<text key={y} x={cx} y={y} textAnchor="middle" fontSize={6.5} fill="rgba(255,245,210,0.6)" fontFamily={MONO} letterSpacing={1}>{ln.text}</text>, 10);
        break;
      case "date":
        push(<text key={y} x={cx} y={y} textAnchor="middle" fontSize={6} fill="rgba(255,245,210,0.38)" fontFamily={MONO} letterSpacing={1}>{ln.text}</text>, 9);
        break;
      case "gap":
        y += ln.px || 4;
        break;
      case "dual": {
        const col1 = cx - bw*0.26, col2 = cx + bw*0.26;
        const startY = y;
        els.push(<line key={"div"+y} x1={cx} y1={startY-4} x2={cx} y2={startY+50} stroke="rgba(255,245,210,0.17)" strokeWidth={1}/>);
        els.push(<text key={"li"+y} x={col1} y={startY} textAnchor="middle" fontSize={12}>{ln.icon1}</text>);
        els.push(<text key={"lt"+y} x={col1} y={startY+14} textAnchor="middle" fontSize={7.5} fill="rgba(255,245,210,0.93)" fontFamily={FELL} fontStyle="italic">{ln.t1a}</text>);
        els.push(<text key={"lt2"+y} x={col1} y={startY+24} textAnchor="middle" fontSize={7.5} fill="rgba(255,245,210,0.93)" fontFamily={FELL} fontStyle="italic">{ln.t1b||""}</text>);
        els.push(<text key={"la"+y} x={col1} y={startY+36} textAnchor="middle" fontSize={6} fill="rgba(255,245,210,0.58)" fontFamily={MONO} letterSpacing={1}>{ln.a1}</text>);
        els.push(<text key={"ri"+y} x={col2} y={startY} textAnchor="middle" fontSize={12}>{ln.icon2}</text>);
        els.push(<text key={"rt"+y} x={col2} y={startY+14} textAnchor="middle" fontSize={7.5} fill="rgba(255,245,210,0.93)" fontFamily={FELL} fontStyle="italic">{ln.t2a}</text>);
        els.push(<text key={"rt2"+y} x={col2} y={startY+24} textAnchor="middle" fontSize={7.5} fill="rgba(255,245,210,0.93)" fontFamily={FELL} fontStyle="italic">{ln.t2b||""}</text>);
        els.push(<text key={"ra"+y} x={col2} y={startY+36} textAnchor="middle" fontSize={6} fill="rgba(255,245,210,0.58)" fontFamily={MONO} letterSpacing={1}>{ln.a2}</text>);
        y += 52;
        break;
      }
    }
  }

  return (
    <div
      className="stamp-wrap"
      onClick={onToggle}
      title={title}
      style={{
        transform:`rotate(${rot}deg)`,
        display:"inline-block",
        flexShrink:0,
      }}
    >
      <span className="stamp-badge" data-html2canvas-ignore="true">×</span>
      <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ overflow:"visible", display:"block" }}>
        <rect x={pad+2.5} y={pad+3} width={bw} height={bh} rx={2} fill="rgba(38,22,6,0.18)"/>
        <rect x={pad} y={pad} width={bw} height={bh} rx={2} fill={color}/>
        <rect x={pad+5} y={pad+5} width={bw-10} height={bh-10} rx={1} fill="none" stroke="rgba(255,245,210,0.18)" strokeWidth={1}/>
        {els}
        {holes}
      </svg>
    </div>
  );
}

function EmptyStamp({ pageBg=CREAM, w=146, h=146, rot=0, onToggle, title, restoreLabel }) {
  const r=4.5, gap=14, pad=Math.round(r)+4;
  const holes=[];
  for(let x=pad;x<=w-pad;x+=gap){
    holes.push(<circle key={"t"+x} cx={x} cy={pad-1}   r={r} fill={pageBg}/>);
    holes.push(<circle key={"b"+x} cx={x} cy={h-pad+1} r={r} fill={pageBg}/>);
  }
  for(let y=pad+gap;y<=h-pad-gap;y+=gap){
    holes.push(<circle key={"l"+y} cx={pad-1}   cy={y} r={r} fill={pageBg}/>);
    holes.push(<circle key={"R"+y} cx={w-pad+1} cy={y} r={r} fill={pageBg}/>);
  }
  return (
    <div
      className={onToggle ? "stamp-wrap" : undefined}
      onClick={onToggle}
      title={title}
      style={{ transform:`rotate(${rot}deg)`, display:"inline-block", flexShrink:0, cursor: onToggle ? "pointer" : "default" }}
    >
      {onToggle && <span className="stamp-badge" data-html2canvas-ignore="true">+</span>}
      <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ display:"block" }}>
        <rect x={pad} y={pad} width={w-pad*2} height={h-pad*2} rx={2}
          fill="rgba(100,72,22,0.06)" stroke="rgba(100,72,22,0.22)" strokeWidth={1} strokeDasharray="4 3"/>
        <text x={w/2} y={h/2-5}  textAnchor="middle" fontSize={8} fill="rgba(80,58,14,0.26)" fontFamily={ELITE} letterSpacing={2}>AWAITING</text>
        <text x={w/2} y={h/2+9}  textAnchor="middle" fontSize={8} fill="rgba(80,58,14,0.26)" fontFamily={ELITE} letterSpacing={2}>ENTRY</text>
        {restoreLabel && (
          <text
            data-html2canvas-ignore="true"
            x={w/2} y={h/2+26}
            textAnchor="middle"
            fontSize={6.5}
            fill="rgba(80,58,14,0.45)"
            fontFamily={MONO}
            letterSpacing={0.5}
          >
            Click to restore {restoreLabel}
          </text>
        )}
        {holes}
      </svg>
    </div>
  );
}

/* ══ STAMP SLOT WRAPPER ══ */
function StampSlot({ stamp, pageBg, removed, onToggle }) {
  if (removed) {
    return (
      <EmptyStamp
        pageBg={pageBg}
        w={stamp.w}
        h={stamp.h}
        rot={stamp.rot}
        onToggle={() => onToggle(stamp.id)}
        title={`Click to restore ${stamp.label}`}
        restoreLabel={stamp.label}
      />
    );
  }
  return (
    <Stamp
      color={stamp.color}
      pageBg={pageBg}
      w={stamp.w}
      h={stamp.h}
      rot={stamp.rot}
      lines={stamp.lines}
      onToggle={() => onToggle(stamp.id)}
      title={`Click to remove ${stamp.label} (didn't attend)`}
    />
  );
}

/* ══ LOG WITH 5-STAR RATING ══ */
function StarRating({ rating, onRate }) {
  return (
    <div style={{ display:"flex", alignItems:"center", gap:1, flexShrink:0 }} title="Click stars to rate">
      {[1, 2, 3, 4, 5].map(star => {
        const filled = star <= rating;
        return (
          <button
            key={star}

function LogPage({ id, removed, ratings, onRate }) {

        flag: st.flag,
        book: b.title,
        meta: `${b.author} · ${st.country}`,

  const countriesCount = activeStamps.length;

      {entries.map((e, idx) => (
        <LogEntry
          key={e.bookId}
          n={String(idx + 1).padStart(2, "0")}
          flag={e.flag}
          book={e.book}
          meta={e.meta}

}

/* ══ APP ══ */
const PAGE_IDS = ["pg0","pg1","pg2","pg3","pg4","pg5"];

function App() {
  const [name,    setName]    = useState("");
  const [busy,    setBusy]    = useState(null);
  const [msg,     setMsg]     = useState("");
  const [removed, setRemoved] = useState(() => new Set());
  const [ratings, setRatings] = useState({});
  const scale = useScale();

  function applyName(n) {
    const val = n.trim() || "Member Name";
    window.__passportName = val;
    window.dispatchEvent(new Event("passportNameChange"));
  }

  function toggleStamp(stampId) {
    setRemoved(prev => {
      const next = new Set(prev);
      if (next.has(stampId)) next.delete(stampId);
      else next.add(stampId);
      return next;
    });
  }

  function restoreAll() {
    setRemoved(new Set());
  }

  function handleRate(bookId, star) {
    setRatings(prev => ({ ...prev, [bookId]: star }));
  }

  const allActiveBooks = STAMPS_DATA
    .filter(st => !removed.has(st.id))
    .flatMap(st => st.books);
  let topBook = null;
  let topScore = 0;
  for (const b of allActiveBooks) {
    const r = ratings[b.id] || 0;
    if (r > topScore) {
      topScore = r;
      topBook = b;
    }
  }
  const favoriteBook = topBook ? `${topBook.title} (${"★".repeat(topScore)})` : "";

  /* ── Shared page capture helper ── */
  async function captureAllPages() {
    const images = [];
    for (let i = 0; i < PAGE_IDS.length; i++) {
      setMsg(`Capturing page ${i+1} of ${PAGE_IDS.length}…`);
      const el = document.getElementById(PAGE_IDS[i]);
      if (!el) continue;

      const wrapper = el.parentElement;
      const origTransform = wrapper ? wrapper.style.transform : "";
      if (wrapper) wrapper.style.transform = "none";

      const canvas = await html2canvas(el, {
        scale: 2,
        useCORS: true,
        backgroundColor: null,
        width: W,
        height: H,
        windowWidth: W,
        windowHeight: H,
        logging: false,
      });

      if (wrapper) wrapper.style.transform = origTransform;
      images.push(canvas.toDataURL("image/png"));
    }
    return images;
  }

  /* ── 1. Sequential Single-Page A5 PDF ── */
  async function downloadSinglePDF() {
    const n = (window.__passportName || "Member Name").trim();
    setBusy("single");
    setMsg("Preparing A5 pages…");
    try {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation:"portrait", unit:"pt", format:"a5" });
      const PW = 419.53, PH = 595.28;

      const imgs = await captureAllPages();
      imgs.forEach((img, i) => {
        if (i > 0) pdf.addPage([PW, PH], "portrait");
        pdf.addImage(img, "PNG", 0, 0, PW, PH);
      });

      const safe = n.replace(/[^a-z0-9]/gi, "_").toLowerCase();
      pdf.save("rdu_passport_" + safe + ".pdf");
      setMsg("");
    } catch(e) {
      setMsg("Error: " + e.message);
      setTimeout(() => setMsg(""), 4000);
    }
    setBusy(null);
  }

  /* ── 2. Imposed Print-Ready Booklet PDF (3 A4 Landscape Sheets) ── */
  async function downloadBookletPDF() {
    const n = (window.__passportName || "Member Name").trim();
    setBusy("booklet");
    setMsg("Arranging booklet spreads…");
    try {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation:"landscape", unit:"pt", format:"a4" });
      const HALF_W = 420.945, FULL_H = 595.28;

      const imgs = await captureAllPages();
      const spreads = [
        [5, 0],
        [1, 4],
        [3, 2],
      ];

      spreads.forEach(([leftIdx, rightIdx], sIdx) => {
        if (sIdx > 0) pdf.addPage("a4", "landscape");
        if (imgs[leftIdx])  pdf.addImage(imgs[leftIdx],  "PNG", 0,      0, HALF_W, FULL_H);
        if (imgs[rightIdx]) pdf.addImage(imgs[rightIdx], "PNG", HALF_W, 0, HALF_W, FULL_H);

        pdf.setDrawColor(160, 145, 120);
        pdf.setLineWidth(0.5);
        pdf.line(HALF_W, 0, HALF_W, 8);
        pdf.line(HALF_W, FULL_H - 8, HALF_W, FULL_H);
      });

      const safe = n.replace(/[^a-z0-9]/gi, "_").toLowerCase();
      pdf.save("rdu_passport_booklet_print_" + safe + ".pdf");
      setMsg("");
    } catch(e) {
      setMsg("Error: " + e.message);
      setTimeout(() => setMsg(""), 4000);
    }
    setBusy(null);
  }

  const sc = scale;
  const ctrlW = Math.min(W, window.innerWidth - 32);

  return (
    <div style={{ background:DARK, minHeight:"100vh", padding:"28px 16px 64px", display:"flex", flexDirection:"column", alignItems:"center", gap:24 }}>

      {/* Controls */}
      <div style={{ width:ctrlW, background:"#242018", border:"1px solid #4a3c28", borderRadius:6, padding:"14px 16px", display:"flex", flexDirection:"column", alignItems:"center", gap:10 }}>
        <span style={elite("0.62rem",GOLD,{ letterSpacing:"0.2em", textTransform:"uppercase", textAlign:"center" })}>Personalize Your Passport</span>

        <div style={{ display:"flex", gap:8, width:"100%", flexWrap:"wrap" }}>
          <input
            value={name}
            onChange={e => { setName(e.target.value); applyName(e.target.value); }}
            onKeyDown={e => { if(e.key==="Enter"){ applyName(name); } }}
            placeholder="Enter member name…"
            style={{ flex:1, minWidth:140, background:"#1a1612", border:"1px solid #4a3c28", borderRadius:3, color:"#f0deb0", fontFamily:MONO, fontSize:"1rem", padding:"10px 11px", outline:"none" }}
          />
          <button onClick={() => applyName(name)}
            style={{ background:"#5a4010", border:"none", borderRadius:3, color:"#f0deb0", fontFamily:ELITE, fontSize:"0.72rem", letterSpacing:"0.14em", padding:"10px 18px", cursor:"pointer", textTransform:"uppercase", whiteSpace:"nowrap", touchAction:"manipulation" }}>
            Generate ✦
          </button>
        </div>

        {/* Stamp Attendance Toggle Pills */}
        <div style={{ width:"100%", borderTop:"1px solid rgba(200,168,74,0.14)", paddingTop:10, display:"flex", flexDirection:"column", gap:6 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <span style={mono("0.52rem","#9a865c",{ letterSpacing:"0.08em", textTransform:"uppercase" })}>
              Attended Months (click to toggle)
            </span>
            {removed.size > 0 && (
              <button
                onClick={restoreAll}
                style={{ background:"transparent", border:"1px solid rgba(200,168,74,0.3)", color:GOLD, fontFamily:MONO, fontSize:"0.52rem", padding:"2px 7px", cursor:"pointer", letterSpacing:"0.06em" }}
              >
                Restore All ({removed.size} removed)
              </button>
            )}
          </div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:5 }}>
            {STAMPS_DATA.map(st => {
              const active = !removed.has(st.id);
              return (
                <button
                  key={st.id}
                  onClick={() => toggleStamp(st.id)}
                  style={{
                    background: active ? "rgba(200,168,74,0.14)" : "#1a1612",
                    border: `1px solid ${active ? "rgba(200,168,74,0.45)" : "#352c1e"}`,
                    color: active ? "#f0deb0" : "#5e5038",
                    textDecoration: active ? "none" : "line-through",
                    fontFamily: MONO,
                    fontSize: "0.56rem",
                    padding: "4px 8px",
                    cursor: "pointer",
                    display: "flex",
                    alignItems: "center",
                    gap: 4,
                  }}
                >
                  <span>{st.flag}</span>
                  <span>{st.mo}</span>
                  <span style={{ opacity:0.7, fontSize:"0.62rem" }}>{active ? "×" : "+"}</span>
                </button>
              );
            })}
          </div>
        </div>

        {/* Download Buttons */}
        <div style={{ display:"flex", gap:8, width:"100%", flexWrap:"wrap" }}>
          <button onClick={downloadBookletPDF} disabled={!!busy}
            style={{ flex:1, minWidth:180, background: busy ? "#1a2010" : "#1e3a14", border:`1px solid ${busy?"#2a3018":"#3a6a22"}`, borderRadius:3, color: busy ? "#5a7040" : "#90c870", fontFamily:ELITE, fontSize:"0.68rem", letterSpacing:"0.12em", padding:"11px 10px", cursor: busy?"not-allowed":"pointer", textTransform:"uppercase", touchAction:"manipulation", display:"flex", alignItems:"center", justifyContent:"center", gap:6 }}>
            {busy === "booklet"
              ? <><span style={{ display:"inline-block", animation:"spin 1s linear infinite", fontSize:"0.95rem", lineHeight:1 }}>⟳</span>{msg}</>
              : <>🖨️ &nbsp;Print Booklet (A4 Fold)</>}
          </button>

          <button onClick={downloadSinglePDF} disabled={!!busy}
            style={{ flex:1, minWidth:150, background: busy ? "#1a1814" : "#2e261a", border:`1px solid ${busy?"#2a2418":"#5a482c"}`, borderRadius:3, color: busy ? "#6a5c44" : "#e6cf98", fontFamily:ELITE, fontSize:"0.68rem", letterSpacing:"0.12em", padding:"11px 10px", cursor: busy?"not-allowed":"pointer", textTransform:"uppercase", touchAction:"manipulation", display:"flex", alignItems:"center", justifyContent:"center", gap:6 }}>
            {busy === "single"
              ? <><span style={{ display:"inline-block", animation:"spin 1s linear infinite", fontSize:"0.95rem", lineHeight:1 }}>⟳</span>{msg}</>
              : <>⬇ &nbsp;Single Pages (A5)</>}
          </button>
        </div>

        <span style={mono("0.51rem","#786644",{ letterSpacing:"0.07em", textAlign:"center", lineHeight:1.5 })}>
          Click stamps to toggle attendance · Rate books on Page 5 ★ · Print Booklet on A4/Letter double-sided (flip on short edge)
        </span>
      </div>

      {/* Pages */}
      {PAGE_IDS.map((pid, i) => (
        <div key={pid} style={{ width: W*sc, height: H*sc, position:"relative", flexShrink:0 }}>
          <div style={{ position:"absolute", top:0, left:0, transform:`scale(${sc})`, transformOrigin:"top left" }}>
            {i===0 && <CoverPage   id={pid}/>}
            {i===1 && <MemberPage  id={pid} favoriteBook={favoriteBook}/>}
            {i===2 && <StampsPage1 id={pid} removed={removed} onToggle={toggleStamp}/>}
            {i===3 && <StampsPage2 id={pid} removed={removed} onToggle={toggleStamp}/>}
            {i===4 && <LogPage     id={pid} removed={removed} ratings={ratings} onRate={handleRate}/>}
            {i===5 && <NotesPage   id={pid}/>}
          </div>
        </div>
      ))}
